related_formalizations: []

status:
  scope: >-
    Formalized: Kurz's bound (kurz_conjecture) and the sharper bound (kurz_conjecture_sharp) for
    every polyhex, stated for the regular hexagonal tiling of the Euclidean plane, and the area
    √3/2 of one cell (volume_hexagon), which fixes the unit of area. The proof works in axial
    coordinates with a skewed hexagon of area 1 (PolyhexHull.Defs to PolyhexHull.Main), and
    PolyhexHull.Bridge transfers the result to the regular tiling with a linear map of
    determinant √3/2. Not formalized: that the sharp bound is attained for every n, which is
    proved in the paper by an explicit path, and the exhaustive computation in scripts/brute.py.
    The formalization therefore proves an upper bound and does not by itself establish that
    ⌈n² + 14n/3⌉ / 6 is the maximum.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
  main_results:
    - "Kurz's Conjecture 2 for polyhexes"
    - "The sharper upper bound ⌈n² + 14n/3⌉ / 6"

