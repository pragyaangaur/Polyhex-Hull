fidelity:
  divergences: >-
    Kurz speaks of regular hexagons of unit area. The formal cells are regular hexagons with
    opposite edges at distance 1, of area √3/2, and every bound is multiplied by the area of one
    cell, which is the same statement after scaling. A polyhex is a finite nonempty set of cells
    that is connected in the adjacency graph of the tiling, where two cells are adjacent when
    they share an edge. Kurz does not say whether the system must be nonempty, and the empty set
    is excluded. Area is Lebesgue measure on ℝ × ℝ, valued in the extended nonnegative reals.
    The attainment of the sharp bound, which makes it the exact maximum, is not formalized.

review:
  status: "author-verified"
  reviewers: []
  notes: >-
    The author checked the informal proof and compared the statements in Challenge.lean with
    Kurz's paper. The Lean proofs use only propext, Classical.choice and Quot.sound, which
    scripts/Axioms.lean prints. scripts/brute.py checks the exact maximum independently for
    every polyhex with at most twelve cells (8,182,213 fixed polyhexes). Kurz was told of the
    result on 12 October 2026 and has not reviewed it. No independent human review of the
    formalization has taken place.

alignment:
  namespace: "KurzPolyhex"
  statements:
    - source: "Conjecture 2 of Kurz, Convex hulls of polyominoes (2008)"
      lean: "KurzPolyhex.kurz_conjecture"
      module: "Challenge"
      status: proved
      note: "Kurz's bound, with area in units of one cell."
    - source: "Upper bound in the main theorem of arXiv:2609.30310"
      lean: "KurzPolyhex.kurz_conjecture_sharp"
      module: "Challenge"
      status: proved
      note: "The sharp upper bound. Its attainment is not formalized."
    - source: "Area of one cell"
      lean: "KurzPolyhex.volume_hexagon"
      module: "Challenge"
      status: proved
      note: "Fixes the unit of area used in the two bounds."

