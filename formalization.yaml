# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Kurz's conjecture on the maximum area of the convex hull of a polyhex"
  description: >-
    A polyhex is an edge-to-edge connected system of cells of the regular hexagonal tiling. Kurz
    (Convex hulls of polyominoes, Beiträge Algebra Geom. 49 (2008), Conjecture 2) conjectured
    that the convex hull of a polyhex with n cells of unit area has area at most
    ⌊n² + 14n/3 + 1⌋ / 6. This formalization proves the conjecture, and the sharper bound
    ⌈n² + 14n/3⌉ / 6, which differs from Kurz's bound by 1/6 when 3 divides n and agrees with it
    otherwise. The statements are made in the Euclidean plane for the regular hexagonal tiling,
    with area measured in units of one cell. The proof writes the hull as the hull of the cell
    centres plus one hexagon, bounds its area through the area of the centre hull and three of
    its widths, and controls both with a spanning tree of the polyhex. The accompanying paper
    (arXiv:2609.30310) also shows that the sharp bound is attained for every n by a path made of
    three straight runs, so that it is the exact maximum. That construction is not formalized.
  authors:
    - "Pragyaan Gaur"
  license: "MIT"
  responsible_maintainers:
    - "Pragyaan Gaur"

classification:
